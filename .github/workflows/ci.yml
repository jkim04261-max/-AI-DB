name: CI

# Runs on every PR targeting main (open, new commits, reopen, and base
# branch changed) and on direct pushes to main, so a change is checked
# both before and after it lands. `edited` is included because GitHub's
# default pull_request types (opened/synchronize/reopened) do NOT include
# a base-branch retarget — a PR whose base is switched to main (e.g. one
# that was stacked on another branch and is now rebased onto main via the
# API) would otherwise never get a check run at all, even though its diff
# against the new base is exactly what needs checking. No repository
# secrets are required — every external call (Gemini, Resend) a test
# exercises is mocked in tests/*.test.cjs, and api/*.ts itself only needs
# real env vars (AUTH_SECRET, GEMINI_API_KEY, Postgres) at actual runtime
# on Vercel, never at type-check/build/test time here.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Typecheck + build frontend
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  e2e:
    # 2026-11-12: `ubuntu-latest`가 ubuntu-26.04로 올라가면서
    # `npx playwright install --with-deps chromium`이 "Playwright 1.56.1
    # does not support chromium on ubuntu26.04-x64"로 매번(재실행해도
    # 동일하게) 실패하기 시작했다 — PR #96/#97에서 서로 무관한 diff로
    # 동시에 재현해 확인(둘 다 같은 시각, 같은 원인, 의존성 설치
    # 단계에서 실패). 네트워크 플레이크가 아니라 러너 이미지가 현재
    # 고정된 Playwright 버전보다 앞서가 버린 것이라 재실행으로는 안
    # 풀린다. `checks` job은 Playwright를 쓰지 않아 영향이 없어 그대로
    # 둔다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The runner has no browser pre-installed (unlike the local sandbox
      # used to develop these tests), so Chromium is downloaded here. This
      # is the only part of the E2E job with a real added cost: extra
      # download time per run, no paid API/service usage (every e2e/*.spec.ts
      # test mocks all /api/** calls — see e2e/README.md).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
